name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang, lld, and llvm
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Fetch nice_cpu and niceemu
        run: make deps
      - name: Test
        run: make test
      - name: Perft to depth 11
        run: make perft-deep
      - name: FFO positions 20 to 38
        run: make ffo-deep
      - name: Against random moves
        run: make match-random
      - name: Size
        run: make size
